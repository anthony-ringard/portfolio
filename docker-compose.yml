services:
  # Développement avec hot-reload : http://localhost:3002
  dev:
    build:
      context: .
      target: dev
    ports:
      - "3002:5173"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - SITE_URL=http://localhost:3002
    command: npm run dev

  # Aperçu de l'export statique de production : http://localhost:3001
  preview:
    build:
      context: .
      target: prod
      args:
        SITE_URL: http://localhost:3001
    ports:
      - "3001:3000"

volumes:
  node_modules:
